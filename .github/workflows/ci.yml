name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # One job, so the OxCaml toolchain is fetched once from prigh's binary cache
  # (the flake's nixConfig, accepted here). /nix/store is cached between runs,
  # and each nix step retries: a cache dropping the connection mid-download
  # leaves what was fetched, so a retry resumes.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            accept-flake-config = true
            download-attempts = 10
            connect-timeout = 30
      - uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock', '**/*.nix') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 8G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never

      # The dune tests: components' expect tests, the docs app's, the CLI's cram tests.
      - name: dune tests
        run: |
          for i in 1 2 3; do
            nix develop --accept-flake-config -c dune build @runtest && exit 0
            echo "attempt $i failed; retrying in 60s"; sleep 60
          done
          exit 1

      # The docs site, built whole-program by Nix, in Chromium, Firefox and WebKit.
      - name: e2e
        run: |
          for i in 1 2 3; do
            nix build --accept-flake-config -L .#checks.x86_64-linux.e2e && exit 0
            echo "attempt $i failed; retrying in 60s"; sleep 60
          done
          exit 1

      # The same site, for GitHub Pages (hash routing and relative URLs, so
      # it works under /loon/).
      - name: docs site
        if: github.event_name != 'pull_request'
        run: |
          nix build --accept-flake-config .#docs -o docs-result
          cp -rL docs-result site
          chmod -R u+w site
          rm -rf site/dune site/main.bc.map
          touch site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: site

  # GitHub Pages serves the docs site from main.
  pages:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
